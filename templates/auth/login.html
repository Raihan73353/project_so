{% extends "base.html" %}
{% block title %}Login - Portal Karir & Magang{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h4 class="card-title text-center fw-bold mb-1">Selamat Datang</h4>
                <p class="text-muted text-center small mb-4">Masuk ke akun PortalKarir Anda</p>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="nama@email.com">
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="Masukkan password">
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary fw-semibold">Masuk</button>
                    </div>
                </form>

                <hr class="my-4">
                <p class="text-center small mb-0">
                    Belum punya akun? <a href="{{ url_for('register') }}" class="text-decoration-none fw-semibold">Daftar di sini</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
