{% extends "base.html" %}
{% block title %}Daftar Akun - Portal Karir & Magang{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h4 class="card-title text-center fw-bold mb-1">Buat Akun Baru</h4>
                <p class="text-muted text-center small mb-4">Portal Lowongan Magang & Karir</p>

                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Daftar Sebagai</label>
                        <select name="role" id="roleSelect" class="form-select" required>
                            <option value="seeker" selected>Pencari Kerja / Mahasiswa Magang</option>
                            <option value="company">Perusahaan / Penyedia Lowongan</option>
                        </select>
                    </div>

                    <div class="mb-3" id="companyField" style="display: none;">
                        <label for="company_name" class="form-label fw-semibold">Nama Perusahaan</label>
                        <input type="text" class="form-control" id="company_name" name="company_name" placeholder="Contoh: PT Teknologi Nusantara">
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Nama Lengkap (PIC / Pelamar)</label>
                        <input type="text" class="form-control" id="name" name="name" required placeholder="Masukkan nama lengkap">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Alamat Email</label>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="nama@email.com">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required minlength="6" placeholder="Minimal 6 karakter">
                    </div>

                    <div class="mb-4">
                        <label for="confirm_password" class="form-label fw-semibold">Konfirmasi Password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="6" placeholder="Ulangi password">
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary fw-semibold">Daftar Sekarang</button>
                    </div>
                </form>

                <hr class="my-4">
                <p class="text-center small mb-0">
                    Sudah punya akun? <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold">Login di sini</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const roleSelect = document.getElementById('roleSelect');
    const companyField = document.getElementById('companyField');
    const companyInput = document.getElementById('company_name');

    roleSelect.addEventListener('change', function () {
        if (this.value === 'company') {
            companyField.style.display = 'block';
            companyInput.setAttribute('required', 'required');
        } else {
            companyField.style.display = 'none';
            companyInput.removeAttribute('required');
            companyInput.value = '';
        }
    });
</script>
{% endblock %}
